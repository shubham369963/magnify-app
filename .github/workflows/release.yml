name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Run CI checks for release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag resolves to this commit
        run: test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Check whether release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        if: steps.release-check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  deploy:
    name: Deploy release commit to Render
    needs: [checks, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy
        id: render-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "Set the RENDER_API_KEY secret and RENDER_SERVICE_ID Actions variable."
            exit 1
          fi

          response="$(curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg commitId "$DEPLOY_COMMIT_SHA" '{commitId: $commitId}')" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")"
          deploy_id="$(jq -r '.id // empty' <<< "$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "Render did not return a deploy ID."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deploy="$(curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}")"
            status="$(jq -r '.status // empty' <<< "$deploy")"

            if [[ "$status" == live ]]; then
              echo "Render deploy $RENDER_DEPLOY_ID is live."
              exit 0
            fi
            if [[ "$status" == build_failed || "$status" == update_failed || "$status" == canceled || "$status" == pre_deploy_failed ]]; then
              echo "Render deploy $RENDER_DEPLOY_ID failed with status: $status"
              exit 1
            fi
            echo "Render deploy status is '${status:-unknown}'; retrying."
            sleep 15
          done
          echo "Render deploy $RENDER_DEPLOY_ID did not become live before timeout."
          exit 1