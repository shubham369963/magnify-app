name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Render on release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL Actions secret."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --output /dev/null
          echo "Render deploy hook accepted release $GITHUB_REF_NAME."