services:
  # One public service runs the UI, API, worker, and local monitoring processes.
  - type: web
    name: magnify-api
    runtime: docker
    branch: main
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    dockerCommand: node server/scripts/start-all.mjs
    autoDeployTrigger: "off"
    healthCheckPath: /
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_PORT
        value: "8000"
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: WORKER_METRICS_PORT
        value: "9464"
      - key: MAX_PDF_SIZE_BYTES
        value: "3145728"
      - key: METRICS_SERVICE_NAME
        value: magnify-api
      - fromGroup: magnify-runtime
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PDF_INDEX_CHECKPOINT_DIR
        value: /app/uploads/.vector-index-checkpoints
      - key: NEXT_PUBLIC_MAX_PDF_SIZE_BYTES
        value: "3145728"
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GRAFANA_ADMIN_USER
        sync: false
      - key: GRAFANA_ADMIN_PASSWORD
        sync: false

envVarGroups:
  # Shared non-secret runtime defaults for the backend API and worker.
  - name: magnify-runtime
    envVars:
      - key: PDF_WORKER_CONCURRENCY
        value: "4"
      - key: GEMINI_EMBEDDING_BATCH_CONCURRENCY
        value: "2"
      - key: PDF_IMAGE_CONCURRENCY
        value: "4"
      - key: PDF_RENDER_CONCURRENCY
        value: "2"
      - key: PDF_IMAGE_MIN_WIDTH
        value: "150"
      - key: PDF_IMAGE_MIN_HEIGHT
        value: "150"
      - key: PDF_IMAGE_MIN_DISPLAY_POINTS
        value: "72"
      - key: PDF_IMAGE_MAX_REPEAT_PAGES
        value: "3"
      - key: OLLAMA_CLOUD_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_CLOUD_CHAT_MODEL
        value: gemma4:31b
      - key: OLLAMA_CLOUD_VISION_MODEL
        value: gemma4:31b
      - key: RAG_MIN_RELEVANCE_SCORE
        value: "0.45"
      - key: RAG_TREE_MAX_CANDIDATES_PER_CALL
        value: "20"
      - key: RAG_TREE_MAX_EVIDENCE
        value: "8"
      - key: RAG_TREE_MAX_CONTEXT_EXPANSIONS
        value: "4"
      - key: RAG_TREE_SELECTOR_TOKEN_BUDGET
        value: "12000"
      # Keep the embedding model and dimensions compatible with stored Qdrant vectors.
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_EMBEDDING_BATCH_SIZE
        value: "100"
      - key: GEMINI_EMBEDDING_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_EMBEDDING_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: GEMINI_EMBEDDING_RETRY_DELAY_MS
        value: "250"
      - key: GEMINI_EMBEDDING_MAX_RETRY_AFTER_MS
        value: "120000"
      - key: GEMINI_EMBEDDING_RATE_LIMIT_PER_MINUTE
        value: "100"
      - key: GEMINI_EMBEDDING_RATE_LIMIT_UNIT
        value: request
      - key: SUPABASE_STORAGE_BUCKET
        value: documents