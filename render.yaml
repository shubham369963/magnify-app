services:
  # Private Redis-compatible queue used by the API and worker.
  - type: keyvalue
    name: magnify-redis
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  # Public NestJS API. Uploaded PDFs and vectors live in Supabase and Qdrant.
  - type: web
    name: magnify-api
    runtime: docker
    rootDir: server
    branch: main
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Start the HTTP API on the port configured by APP_PORT.
    dockerCommand: node dist/main.js
    autoDeployTrigger: checksPass
    healthCheckPath: /
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_PORT
        value: "10000"
      - key: MAX_PDF_SIZE_BYTES
        value: "3145728"
      - key: METRICS_SERVICE_NAME
        value: magnify-api
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: magnify-redis
          property: connectionString
      - fromGroup: magnify-runtime
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PDF_INDEX_CHECKPOINT_DIR
        value: /app/uploads/.vector-index-checkpoints

  # Background PDF ingestion and indexing process.
  - type: worker
    name: magnify-worker
    runtime: docker
    rootDir: server
    branch: main
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Start the BullMQ PDF ingestion worker.
    dockerCommand: node dist/worker-node/worker.js
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: magnify-redis
          property: connectionString
      - fromGroup: magnify-runtime
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_METRICS_PORT
        value: "9464"
      - key: METRICS_SERVICE_NAME
        value: magnify-worker

  # Next.js frontend; its server-side rewrite calls the API over Render's private network.
  - type: web
    name: magnify-web
    runtime: node
    rootDir: client
    branch: main
    region: oregon
    plan: 0.5c-512mb
    # Install frontend dependencies and produce the Next.js production bundle.
    buildCommand: corepack enable && yarn install --frozen-lockfile --non-interactive && yarn build
    # Bind the production frontend server to Render's assigned port.
    startCommand: yarn next start --hostname 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_PUBLIC_MAX_PDF_SIZE_BYTES
        value: "3145728"
      - key: NEST_API_HOSTPORT
        fromService:
          type: web
          name: magnify-api
          property: hostport
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

envVarGroups:
  # Shared non-secret runtime defaults for the backend API and worker.
  - name: magnify-runtime
    envVars:
      - key: OLLAMA_CLOUD_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_CLOUD_CHAT_MODEL
        value: gemma4:31b
      - key: OLLAMA_CLOUD_VISION_MODEL
        value: gemma4:31b
      - key: RAG_MIN_RELEVANCE_SCORE
        value: "0.45"
      - key: RAG_TREE_MAX_CANDIDATES_PER_CALL
        value: "20"
      - key: RAG_TREE_MAX_EVIDENCE
        value: "8"
      - key: RAG_TREE_MAX_CONTEXT_EXPANSIONS
        value: "4"
      - key: RAG_TREE_SELECTOR_TOKEN_BUDGET
        value: "12000"
      # Keep the embedding model and dimensions compatible with stored Qdrant vectors.
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_EMBEDDING_BATCH_SIZE
        value: "100"
      - key: GEMINI_EMBEDDING_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_EMBEDDING_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: GEMINI_EMBEDDING_RETRY_DELAY_MS
        value: "250"
      - key: GEMINI_EMBEDDING_RATE_LIMIT_RETRY_DELAY_MS
        value: "15000"
      - key: GEMINI_EMBEDDING_RATE_LIMIT_MAX_DELAY_MS
        value: "60000"
      - key: GEMINI_EMBEDDING_MAX_RETRY_AFTER_MS
        value: "120000"
      - key: SUPABASE_STORAGE_BUCKET
        value: documents