name: pdf-rag-nest

x-backend-environment: &backend-environment
  REDIS_URL: ${REDIS_URL:-}
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:?Set GEMINI_EMBEDDING_MODEL in server/.env}
  GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:?Set GEMINI_EMBEDDING_DIMENSIONS in server/.env}
  GEMINI_EMBEDDING_BATCH_SIZE: ${GEMINI_EMBEDDING_BATCH_SIZE:?Set GEMINI_EMBEDDING_BATCH_SIZE in server/.env}
  GEMINI_EMBEDDING_BATCH_CONCURRENCY: ${GEMINI_EMBEDDING_BATCH_CONCURRENCY:-1}
  GEMINI_EMBEDDING_MAX_ATTEMPTS: ${GEMINI_EMBEDDING_MAX_ATTEMPTS:?Set GEMINI_EMBEDDING_MAX_ATTEMPTS in server/.env}
  GEMINI_EMBEDDING_REQUEST_TIMEOUT_MS: ${GEMINI_EMBEDDING_REQUEST_TIMEOUT_MS:?Set GEMINI_EMBEDDING_REQUEST_TIMEOUT_MS in server/.env}
  GEMINI_EMBEDDING_RETRY_DELAY_MS: ${GEMINI_EMBEDDING_RETRY_DELAY_MS:?Set GEMINI_EMBEDDING_RETRY_DELAY_MS in server/.env}
  GEMINI_EMBEDDING_MAX_RETRY_AFTER_MS: ${GEMINI_EMBEDDING_MAX_RETRY_AFTER_MS:?Set GEMINI_EMBEDDING_MAX_RETRY_AFTER_MS in server/.env}
  GEMINI_EMBEDDING_RATE_LIMIT_PER_MINUTE: ${GEMINI_EMBEDDING_RATE_LIMIT_PER_MINUTE:-100}
  GEMINI_EMBEDDING_RATE_LIMIT_UNIT: ${GEMINI_EMBEDDING_RATE_LIMIT_UNIT:-input}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
  OLLAMA_CLOUD_CHAT_MODEL: ${OLLAMA_CLOUD_CHAT_MODEL:-gemma4:31b}
  OLLAMA_CLOUD_VISION_MODEL: ${OLLAMA_CLOUD_VISION_MODEL:-gemma4:31b}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  COHERE_RERANK_MODEL: ${COHERE_RERANK_MODEL:-rerank-v4.0-pro}
  RAG_TREE_MAX_EVIDENCE: ${RAG_TREE_MAX_EVIDENCE:-10}
  RAG_TREE_MAX_CONTEXT_EXPANSIONS: ${RAG_TREE_MAX_CONTEXT_EXPANSIONS:-4}
  PDF_INDEX_CHECKPOINT_DIR: ${PDF_INDEX_CHECKPOINT_DIR:-/app/uploads/.vector-index-checkpoints}
  MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-3145728}
  METRICS_SERVICE_NAME: ${METRICS_SERVICE_NAME:-magnify-api}
  WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9464}
  PDF_WORKER_CONCURRENCY: ${PDF_WORKER_CONCURRENCY:-4}
  PDF_IMAGE_CONCURRENCY: ${PDF_IMAGE_CONCURRENCY:-4}
  PDF_RENDER_CONCURRENCY: ${PDF_RENDER_CONCURRENCY:-2}
  PDF_IMAGE_MIN_WIDTH: ${PDF_IMAGE_MIN_WIDTH:-150}
  PDF_IMAGE_MIN_HEIGHT: ${PDF_IMAGE_MIN_HEIGHT:-150}
  PDF_IMAGE_MIN_DISPLAY_POINTS: ${PDF_IMAGE_MIN_DISPLAY_POINTS:-72}
  PDF_IMAGE_MAX_REPEAT_PAGES: ${PDF_IMAGE_MAX_REPEAT_PAGES:-3}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
  CLERK_ISSUER: ${CLERK_ISSUER:-}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
  CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-documents}

x-backend: &backend
  image: pdf-rag-nest-backend:local
  build:
    context: ..
    dockerfile: server/Dockerfile
  init: true
  restart: unless-stopped
  environment: *backend-environment
  volumes:
    - uploads:/app/uploads
  depends_on:
    valkey:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  api:
    <<: *backend
    command: ["node", "server/dist/main.js"]
    environment:
      <<: *backend-environment
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:${APP_PORT:-8000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${APP_PORT:-8000}/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend
    command: ["node", "server/dist/worker-node/worker.js"]
    environment:
      <<: *backend-environment
      METRICS_SERVICE_NAME: magnify-worker

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in server/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in server/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  uploads:
  valkey-data:
  qdrant-data:
  prometheus-data:
  grafana-data: