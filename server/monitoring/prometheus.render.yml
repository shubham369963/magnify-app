global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: magnify-api
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8000]
        labels:
          service: api

  - job_name: magnify-worker
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9464]
        labels:
          service: worker