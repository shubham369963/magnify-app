name: pdf-rag-nest

services:
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  valkey-data:
  qdrant-data:
